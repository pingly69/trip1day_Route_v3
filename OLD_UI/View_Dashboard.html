<div class="card shadow-sm border-0 mb-4">
  <div class="card-header bg-white py-3">
    <h5 class="m-0 fw-bold"><i class="fas fa-filter text-primary me-2"></i> ค้นหารายการ (Transactions)</h5>
  </div>
  <div class="card-body bg-light">
    <div class="row g-3">
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">วันที่บันทึก (Created At) ตั้งแต่</label>
        <input type="datetime-local" class="form-control" id="f_startDate_CreatedAt" step="1">
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">ถึงวันที่</label>
        <input type="datetime-local" class="form-control" id="f_endDate_CreatedAt" step="1">
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">วันที่เดินทาง (Req Date) ตั้งแต่</label>
        <input type="date" class="form-control" id="f_startDate_ReqDate">
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">ถึงวันที่</label>
        <input type="date" class="form-control" id="f_endDate_ReqDate">
      </div>
      
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">ชื่อผู้เบิก / รหัสพนักงาน</label>
        <input type="text" class="form-control" id="f_reqName" placeholder="ระบุชื่อ หรือรหัสพนักงาน">
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">ทะเบียนรถ</label>
        <input type="text" class="form-control" id="f_plateNo">
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">Site</label>
        <select class="form-select" id="f_siteId">
          <option value="">-- ทั้งหมด --</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">สถานะ</label>
        <select class="form-select" id="f_status">
          <option value="ALL">-- ทั้งหมด --</option>
          <option value="DRAFT">DRAFT</option>
          <option value="PENDING">PENDING</option>
          <option value="APPROVED">APPROVED</option>
          <option value="REJECTED">REJECTED</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">วันที่อนุมัติ (Approve Date) ตั้งแต่</label>
        <input type="datetime-local" class="form-control" id="f_startDate_Approve" step="1">
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">ถึงวันที่</label>
        <input type="datetime-local" class="form-control" id="f_endDate_Approve" step="1">
      </div>
    </div>
    
    <div class="mt-4 text-center">
      <button class="btn btn-primary px-4" onclick="dash_search()"><i class="fas fa-search"></i> ค้นหา</button>
      <button class="btn btn-outline-secondary px-4 ms-2" onclick="dash_clearFilter()">ล้างค่า</button>
    </div>
  </div>
</div>

<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <h5 class="m-0 fw-bold"><i class="fas fa-list text-primary me-2"></i> ผลการค้นหา <span id="dashCount" class="badge bg-secondary ms-2">0</span></h5>
    <button class="btn btn-success btn-sm" onclick="dash_exportExcel()"><i class="fas fa-file-excel"></i> Export Excel</button>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive" style="max-height: 600px;">
      <table class="table table-hover table-striped align-middle m-0" id="tbDashboard" style="white-space: nowrap;">
        <thead class="table-light sticky-top">
          <tr>
            <th>รหัสรายการ</th>
            <th>วันที่บันทึก</th>
            <th>วันที่เดินทาง</th>
            <th>รหัสพนักงาน</th>
            <th>ชื่อผู้เบิก</th>
            <th>ทะเบียนรถ</th>
            <th>สถานที่ (Site)</th>
            <th>ระยะทาง (กม.)</th>
            <th>ยอดสุทธิ (บาท)</th>
            <th>สถานะ</th>
            <th>ผู้อนุมัติ</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows render here -->
        </tbody>
      </table>
    </div>
  </div>
</div>
