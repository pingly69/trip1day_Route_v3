<div class="card shadow-sm border-0 mb-4">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <h5 class="m-0 fw-bold"><i class="fas fa-building text-primary me-2"></i> จัดการ Master Site</h5>
    <button class="btn btn-primary btn-sm" onclick="site_openModal()"><i class="fas fa-plus"></i> เพิ่ม Site ใหม่</button>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-hover align-middle" id="tbMasterSite">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>รหัส Site (Site ID)</th>
            <th>ชื่อ Site (Site Name)</th>
            <th>สถานะ</th>
            <th class="text-end">จัดการ</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows render here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Master Site -->
<div class="modal fade" id="modalMasterSite" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalMasterSiteLabel">ฟอร์ม Master Site</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMasterSite">
          <input type="hidden" id="site_is_edit" value="false">
          <div class="mb-3">
            <label for="site_id" class="form-label">รหัส Site (Site ID / ERP Code) <span class="text-danger">*</span></label>
            <input type="text" class="form-control font-monospace" id="site_id" placeholder="เช่น BKK-01, ERP-SITE-A" required>
            <div class="form-text text-muted small" id="site_id_help">
              <i class="fas fa-info-circle me-1"></i>ระบุรหัสจากระบบ ERP (ห้ามซ้ำ) ไม่สามารถแก้ไขได้หลังสร้างแล้ว
            </div>
          </div>
          <div class="mb-3">
            <label for="site_name" class="form-label">ชื่อ Site <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="site_name" placeholder="เช่น คลังสินค้าบางนา" required>
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="site_active" checked>
            <label class="form-check-label" for="site_active">เปิดใช้งาน (Active)</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-primary" onclick="site_saveData()" id="btnSaveSite">บันทึกข้อมูล</button>
      </div>
    </div>
  </div>
</div>
