<div id="loadingOverlay" style="display: none;">
  <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<script>
// --- Global State ---
const AdminState = { 
  isLoggedIn: false,
  sites: [], 
  routes: [], 
  users: [],
  sitesLoaded: false, 
  routesLoaded: false,
  usersLoaded: false
};

function invalidateSites() { 
  AdminState.sitesLoaded = false; 
}

function invalidateRoutes() { 
  AdminState.routesLoaded = false; 
}

function invalidateUsers() { 
  AdminState.usersLoaded = false; 
}

async function loadSitesIfNeeded() {
  if (AdminState.sitesLoaded) return AdminState.sites;
  const res = await ApiClient.call('api_getMasterSites');
  AdminState.sites = res.data;
  AdminState.sitesLoaded = true;
  return AdminState.sites;
}

async function loadRoutesIfNeeded() {
  if (AdminState.routesLoaded) return AdminState.routes;
  const res = await ApiClient.call('api_getMasterRoutes');
  AdminState.routes = res.data;
  AdminState.routesLoaded = true;
  return AdminState.routes;
}

async function loadUsersIfNeeded() {
  if (AdminState.usersLoaded) return AdminState.users;
  const res = await ApiClient.call('api_getUsers');
  AdminState.users = res.data;
  AdminState.usersLoaded = true;
  return AdminState.users;
}

// --- Loading Utils ---
function showLoading() {
  document.getElementById('loadingOverlay').style.display = 'flex';
}
function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
}

// --- Router ---
const PAGE_TITLES = {
  'dashboard': 'Dashboard',
  'masterSite': 'Master Site',
  'masterRoute': 'Master Routes',
  'usersProfile': 'Users Profile'
};

function router_nav(pageId) {
  // Hide all pages
  document.querySelectorAll('.page-section').forEach(el => el.style.display = 'none');
  
  // Show selected
  const page = document.getElementById('page_' + pageId);
  if (page) page.style.display = 'block';
  
  // Update Title
  document.getElementById('pageTitle').innerText = PAGE_TITLES[pageId] || 'Trip1Day Admin';
  
  // Load data for specific pages
  if (pageId === 'dashboard') {
    dash_init();
  } else if (pageId === 'masterSite') {
    site_loadData();
  } else if (pageId === 'masterRoute') {
    route_loadData();
  } else if (pageId === 'usersProfile') {
    users_loadData();
  }
}

// --- UI Events ---
document.getElementById('menu-toggle').addEventListener('click', function (e) {
  e.preventDefault();
  document.getElementById('wrapper').classList.toggle('toggled');
});

// --- Auth Guard ---
let loginModal;

document.addEventListener("DOMContentLoaded", function() {
  loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
  
  const isAuthenticated = sessionStorage.getItem('isAdminAuth');
  if (isAuthenticated === 'true') {
    showApp();
  } else {
    loginModal.show();
  }
});

async function app_login() {
  const code = document.getElementById('adminPasscode').value;
  if (!code) return;
  
  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> กำลังตรวจสอบ...';
  
  try {
    await ApiClient.call('api_verifyPasscode', code);
    sessionStorage.setItem('isAdminAuth', 'true');
    loginModal.hide();
    showApp();
  } catch (err) {
    Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบล้มเหลว', text: err });
    document.getElementById('adminPasscode').value = '';
  } finally {
    btn.disabled = false;
    btn.innerText = 'เข้าสู่ระบบ';
  }
}

function app_logout() {
  sessionStorage.removeItem('isAdminAuth');
  document.getElementById('appContainer').style.display = 'none';
  document.getElementById('adminPasscode').value = '';
  loginModal.show();
}

function showApp() {
  document.getElementById('appContainer').style.display = 'block';
  router_nav('dashboard');
}
</script>
