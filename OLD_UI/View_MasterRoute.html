<div class="card shadow-sm border-0 mb-4">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <h5 class="m-0 fw-bold"><i class="fas fa-map-marker-alt text-primary me-2"></i> จัดการ Master Routes</h5>
    <button class="btn btn-primary btn-sm" onclick="route_openModal()"><i class="fas fa-plus"></i> เพิ่มเส้นทางใหม่</button>
  </div>
  <div class="card-body">
    
    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label text-muted small mb-1">กรองตาม Site</label>
        <select class="form-select" id="filterRouteSite" onchange="route_applyFilter()">
          <option value="ALL">-- ดูทุก Site --</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle" id="tbMasterRoute">
        <thead class="table-light">
          <tr>
            <th>Site</th>
            <th>ชื่อเส้นทาง (Route Name)</th>
            <th>ต้นทาง</th>
            <th>ปลายทาง</th>
            <th>ระยะทาง (กม.)</th>
            <th>สถานะ</th>
            <th class="text-end">จัดการ</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows render here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Master Route -->
<div class="modal fade" id="modalMasterRoute" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalMasterRouteLabel">ฟอร์ม Master Route</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formMasterRoute">
          <input type="hidden" id="route_id">
          
          <div class="mb-3">
            <label for="route_site_id" class="form-label">เลือก Site <span class="text-danger">*</span></label>
            <select class="form-select" id="route_site_id" required>
              <!-- Options populated by JS -->
            </select>
          </div>
          <div class="mb-3">
            <label for="route_name" class="form-label">ชื่อเส้นทาง <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="route_name" required>
          </div>
          <div class="row mb-3">
            <div class="col-6">
              <label for="route_origin" class="form-label">ต้นทาง <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="route_origin" required>
            </div>
            <div class="col-6">
              <label for="route_destination" class="form-label">ปลายทาง <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="route_destination" required>
            </div>
          </div>
          <div class="mb-3">
            <label for="route_distance" class="form-label">ระยะทาง (กม.) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="route_distance" step="0.1" min="0.1" required>
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="route_active" checked>
            <label class="form-check-label" for="route_active">เปิดใช้งาน (Active)</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-primary" onclick="route_saveData()" id="btnSaveRoute">บันทึกข้อมูล</button>
      </div>
    </div>
  </div>
</div>
