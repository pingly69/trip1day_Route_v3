<div class="card shadow-sm border-0 mb-4">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
    <h5 class="m-0 fw-bold"><i class="fas fa-users text-primary me-2"></i> จัดการผู้ใช้งาน (Users Profile)</h5>
    <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="users_openModal()">
      <i class="fas fa-plus"></i> เพิ่มผู้ใช้
    </button>
  </div>
  <div class="card-body bg-light">
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <input type="text" class="form-control" id="f_userSearch" placeholder="ค้นหาจาก ชื่อ, รหัสพนักงาน, ทะเบียนรถ, หรือ Line UID..." onkeyup="if(event.key === 'Enter') users_search()">
      </div>
      <div class="col-md-2">
        <button class="btn btn-secondary w-100" onclick="users_search()"><i class="fas fa-search"></i> ค้นหา</button>
      </div>
    </div>
    
    <div class="table-responsive bg-white rounded shadow-sm border">
      <table class="table table-hover table-striped mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Line UID</th>
            <th>รหัสพนักงาน (Emp No.)</th>
            <th>ชื่อผู้ขอเบิก</th>
            <th>ทะเบียนรถ</th>
            <th>กลุ่มอัตรา (Group Car)</th>
            <th class="text-end">จัดการ</th>
          </tr>
        </thead>
        <tbody id="tb_users">
          <!-- Data will be injected here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal สำหรับ เพิ่ม/แก้ไข -->
<div class="modal fade" id="modalUser" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalUserTitle">เพิ่มผู้ใช้</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="u_isEdit" value="0">
        
        <div class="mb-3">
          <label class="form-label">Line UID <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="u_lineUid" placeholder="ระบุ Line UID">
          <small class="text-muted">ใช้ผูกกับ liff.getProfile().userId</small>
        </div>

        <div class="mb-3">
          <label class="form-label">รหัสพนักงาน (Emp No.)</label>
          <input type="text" class="form-control font-monospace" id="u_empNo" placeholder="ระบุรหัสพนักงาน (ถ้ามี)">
          <small class="text-muted">สำหรับออกรายงาน GL / Excel (ใส่หรือไม่ใส่ก็ได้)</small>
        </div>
        
        <div class="mb-3">
          <label class="form-label">ชื่อผู้ขอเบิก (Requester Name) <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="u_reqName" placeholder="ระบุชื่อพนักงาน">
        </div>

        <div class="mb-3">
          <label class="form-label">ทะเบียนรถ (Car No.) <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="u_carNo" placeholder="ระบุทะเบียนรถ">
        </div>
        
        <div class="mb-3">
          <label class="form-label">กลุ่มอัตรา (Group Car) <span class="text-danger">*</span></label>
          <select class="form-select" id="u_groupCar">
            <option value="1">กลุ่ม 1 (ใช้อัตรา group_car1)</option>
            <option value="2">กลุ่ม 2 (ใช้อัตรา group_car2)</option>
            <option value="3">กลุ่ม 3 (ใช้อัตรา group_car3)</option>
          </select>
        </div>
        
      </div>
      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-primary" onclick="users_save()"><i class="fas fa-save"></i> บันทึก</button>
      </div>
    </div>
  </div>
</div>
